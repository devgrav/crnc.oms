version: '3'
services:

# Security context
  security-db:
    image: "mongo:latest"
    restart: always
    ports:
      - "27020:27017" 
  security-api:
    build: src/Server/src/Crnc.Oms.Security/
    restart: always
    ports:
      - "64708:80"
    environment:
      - "ConnectionStrings:OmsSecurityDb:Server=mongodb://security-db"
    depends_on: 
      - security-db

  # Sales context
  sales-db:
    image: "postgres:latest"
    restart: always 
    ports:
      - 5432:5432
  sales-api:
    build: src/Server/src/Crnc.Oms.Sales/
    restart: always
    ports:
      - "64709:80"
    environment:
      - "ConnectionStrings:OmsSalesDb=Host=sales-db;Database=crnc_oms_sales_db;Username=postgres;Password=docker"
    depends_on: 
      - sales-db
      - security-api