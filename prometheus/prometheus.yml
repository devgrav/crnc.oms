# Интервал сбора задан явно: без секции global Prometheus берёт своё умолчание в 1m,
# и стенд молча расходился с README и AGENTS.md, где обещаны 5 секунд. scrape_timeout
# обязан быть не больше интервала, поэтому тоже задан явно - дефолтные 10s его нарушают.
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:  
- job_name: security_api_monitoring    
  metrics_path: /metrics  
  scheme: http  
  static_configs:
  - targets:
    - security-api:8080
- job_name: sales_api_monitoring    
  metrics_path: /metrics  
  scheme: http  
  static_configs:  
  - targets:
    - sales-api:8080
- job_name: production_api_monitoring    
  metrics_path: /metrics  
  scheme: http  
  static_configs:  
  - targets:  
    - production-api:8080
- job_name: notification_gateway_api_monitoring
  metrics_path: /metrics  
  scheme: http  
  static_configs:  
  - targets:  
    - notification-gateway-api:8080
- job_name: notification_email_api_monitoring    
  metrics_path: /metrics  
  scheme: http  
  static_configs:  
  - targets:  
    - notification-email-api:8080
- job_name: notification_push_api_monitoring    
  metrics_path: /metrics  
  scheme: http  
  static_configs:  
  - targets:  
    - notification-push-api:8080