version: '3'
services:

# Security context
  security-db:
    image: "mongo:latest"
    restart: always
    ports:
      - "27021:27017" 
  security-api:
    build: src/Server/src/Crnc.Oms.Security/
    restart: always
    ports:
      - "8090:80"
    environment:
      - "ConnectionStrings:OmsSecurityDb:Server=mongodb://security-db"
    depends_on: 
      - security-db

  # Sales context
  sales-db:
    image: "postgres:latest"
    restart: always 
    ports:
      - 5433:5432
  sales-api:
    build: src/Server/src/Crnc.Oms.Sales/
    restart: always
    ports:
      - "8091:80"
    environment:
      - "ConnectionStrings:OmsSalesDb=Host=sales-db;Database=crnc_oms_sales_db;Username=postgres;Password=docker"
    depends_on: 
      - sales-db
      - security-api

  # UI
  crnc-oms-ui:
    build:
      context: "src/Client/"
      args:
        SECURITY_API_URL: "http://localhost:8090/api"
        SALES_API_URL: "http://localhost:8091/api"
    restart: always
    ports:
      - "8092:80"      
    depends_on: 
      - security-api
      - sales-api      