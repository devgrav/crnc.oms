# SPA и API живут на одном origin: фронт ходит относительными путями, а этот
# nginx разводит их по сервисам. Так адреса бэкендов не запекаются в бандл на
# этапе сборки и не нужен CORS. См. §4.1 плана миграции.
#
# Апстримы заданы через переменную с resolver'ом намеренно: с литералом в
# proxy_pass nginx резолвит имя один раз при старте и кеширует IP навсегда,
# поэтому пересозданный контейнер бэкенда становится недостижимым.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  add_header Cache-Control no-cache;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/security/ {
    set $security_api http://security-api:8080;
    rewrite ^/api/security/(.*)$ /api/$1 break;
    proxy_pass $security_api;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }

  location /api/sales/ {
    set $sales_api http://sales-api:8080;
    rewrite ^/api/sales/(.*)$ /api/$1 break;
    proxy_pass $sales_api;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }

  location /api/production/ {
    set $production_api http://production-api:8080;
    rewrite ^/api/production/(.*)$ /api/$1 break;
    proxy_pass $production_api;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }

  # SignalR: без Upgrade/Connection хаб не падает, а молча уезжает на long polling,
  # и заметить это можно только во вкладке Network.
  location /hubs/push {
    set $push_api http://notification-push-api:8080;
    proxy_pass $push_api;
    include /etc/nginx/conf.d/proxy-headers.inc;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
