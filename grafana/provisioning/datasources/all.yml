apiVersion: 1

datasources:
  # uid зафиксирован намеренно: на него ссылаются панели дашборда. Без явного uid
  # Grafana генерирует случайный, и провижининг дашборда перестаёт находить источник.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Должен совпадать с global.scrape_interval в prometheus.yml: из него Grafana
      # считает минимальный шаг и $__rate_interval. Если оставить умолчание (15s),
      # графики сглаживаются сильнее, чем есть данных.
      timeInterval: 5s
      # POST не упирается в длину URL на запросах с длинными выражениями.
      httpMethod: POST
      prometheusType: Prometheus
