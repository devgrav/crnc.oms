apiVersion: 1

datasources:
  # uid зафиксирован намеренно: на него ссылаются панели дашборда. Без явного uid
  # Grafana генерирует случайный, и провижининг дашборда перестаёт находить источник.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    editable: true
